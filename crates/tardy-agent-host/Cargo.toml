[package]
name = "tardy-agent-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Durable local bridge between a Tardy identity and coding-agent sessions"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ooda.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "process", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
