      };

      function activeLine(t) {
        for (const L of LINES) if (t >= L.start && t < L.start + L.dur) return L;
        return null;
      }
      function mouth(who, t) {
        for (const L of LINES) {
          if (L.who !== who || t < L.start || t >= L.start + L.dur) continue;
          const arr = window.RMS[L.id];
          const db = arr[clamp(Math.floor((t - L.start) * 30), 0, arr.length - 1)];
          return clamp((db + 42) / 26, 0, 1);
        }
        return 0;
      }

      // ---- top half -------------------------------------------------------------------------
      let shownChunk = null;
      function drawCaptions(t) {
        // A chunk shows from its first word until the next chunk (or line) begins.
        let chunk = null, base = 0;
        for (let i = 0; i < LINES.length; i++) {
          const L = LINES[i];
          const next = LINES[i + 1] ? LINES[i + 1].start : DUR;
          L.chunks.forEach((c, j) => {
            const from = L.start + c[0][1] - 0.06;
            const to = L.chunks[j + 1] ? L.start + L.chunks[j + 1][0][1] - 0.06 : next - 0.02;
            if (t >= from && t < to) { chunk = c; base = L.start; }
          });
        }
        const box = $("captions");
        if (chunk !== shownChunk) {
          box.innerHTML = chunk ? chunk.map((w) => `<span class="w">${w[0]}</span>`).join("") : "";
          shownChunk = chunk;
        }
        if (!chunk) return;
        const spans = box.children;
        chunk.forEach((w, i) => {
          const s = base + w[1], e = base + w[2];
          const now = t >= s && t < e + 0.04;
          spans[i].className = "w" + (now ? " now" : t >= s ? " said" : "");
          const pop = now ? 1 + 0.08 * (1 - smooth((t - s) / 0.18)) : 1;
          spans[i].style.transform = `scale(${pop.toFixed(3)})`;
        });
      }

      function drawHosts(t) {
        const L = activeLine(t);
        const speaker = L ? L.who : null;
        const breathe = (k) => Math.sin((2 * Math.PI * t) / 4 + k);
        for (const who of ["chonk", "pip"]) {
          const m = mouth(who, t);
          const talking = speaker === who;
          const el = $(who);
          const sy = 1 + 0.012 * breathe(who === "pip" ? 1.7 : 0) + (talking ? 0.05 * m : 0);
          const sx = 1 - (talking ? 0.025 * m : 0);
          el.style.transform = `scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
          el.style.opacity = talking || !speaker ? 1 : 0.78;
          if (who === "chonk") $("chonk-mouth").setAttribute("ry", (8 + 46 * m).toFixed(1));
          else $("pip-mouth").setAttribute("ry", (5 + 30 * m).toFixed(1));
        }
        // eyes: both glance at whoever is talking
        const look = speaker === "pip" ? 1 : speaker === "chonk" ? -1 : 0;
        $("chonk-pl").setAttribute("cx", 128 + 12 * Math.max(look, 0) - 4 * Math.max(-look, 0));
        $("chonk-pr").setAttribute("cx", 236 + 12 * Math.max(look, 0) - 4 * Math.max(-look, 0));
        $("pip-pl").setAttribute("cx", 78 - 7 * Math.max(-look, 0) + 3 * Math.max(look, 0));
        $("pip-pr").setAttribute("cx", 146 - 7 * Math.max(-look, 0) + 3 * Math.max(look, 0));
        // the glow follows the speaker and kicks on the beat
        const gx = speaker === "pip" ? 400 : speaker === "chonk" ? -40 : 180;
        const g = $("glow");
        g.style.transform = `translateX(${gx}px) scale(${(1 + 0.08 * beatPulse(t)).toFixed(3)})`;
        g.style.opacity = (0.55 + 0.45 * beatPulse(t)).toFixed(3);
      }

      function drawCards(t) {
        // hook card: fully visible on frame 0 (poster + loop), each phrase pops as it's said
        const hookIn = 1 - smooth((t - 3.95) / 0.15) + smooth((t - 31.4) / 0.5);
        $("hook").style.opacity = clamp(hookIn, 0, 1);
        const pops = [["hook-19", 0.33], ["hook-pr", 0.73], ["hook-pr2", 1.02], ["hook-time", 1.77], ["hook-watch", 3.52]];
        for (const [id, at] of pops) {
          const k = t >= at && t < at + 0.3 ? 1 + 0.12 * Math.sin(Math.PI * ((t - at) / 0.3)) : 1;
          $(id).style.transform = `scale(${k.toFixed(3)})`;
        }
        // wordmark: lands on the 28.96 beat (beat-locked), hands back to the hook card for the loop
        const wm = smooth((t - 28.96) / 0.2) * (1 - smooth((t - 30.95) / 0.4));
        $("wordmark").style.opacity = wm.toFixed(3);
        $("wordmark").style.transform = `scale(${(0.86 + 0.14 * easeOutBack((t - 28.96) / 0.45)).toFixed(3)})`;
        const lit = (id, at) => { $(id).style.transform = t >= at && t < at + 0.3 ? `scale(${(1 + 0.1 * Math.sin(Math.PI * ((t - at) / 0.3))).toFixed(3)})` : "scale(1)"; };
        lit("wm-pill", 29.26);
        lit("wm-stay", 29.95);
      }

      // ---- bottom half: HUD and cards ----------------------------------------------------------
      function drawOverlay(t) {
        let count = 0, clock = "03:50:01";
        for (const c of COINS) if (t >= c.t) { count = c.n; clock = c.clock; }
        for (const k of TICKS) if (t >= k.t && k.n > count) { count = k.n; clock = k.clock; }
        $("hud-count").textContent = `MERGED ${String(count).padStart(2, "0")}/19`;
        $("hud-clock").textContent = `${clock} UTC`;
        $("hud").style.opacity = (smooth((t - 4.0) / 0.3) * (1 - smooth((t - 30.9) / 0.4))).toFixed(3);

        // single-PR card: from its coin until the next coin, max 3s
        const singles = COINS.filter((c) => !c.combo);
        let card = null, cardT = 0;
        singles.forEach((c, i) => {
          const end = Math.min(singles[i + 1] ? singles[i + 1].t - 0.12 : 22.9, c.t + 3.0);
          if (t >= c.t && t < end) { card = c; cardT = t - c.t; }
        });
        const cardEl = $("card");
        if (card) {
          $("card-meta").textContent = `#${card.pr} · ${card.clock.slice(0, 5)} UTC`;
          $("card-title").textContent = card.title;
          cardEl.style.opacity = 1;
          cardEl.style.transform = `translateY(${(30 * (1 - easeOutBack(cardT / 0.32))).toFixed(1)}px)`;
        } else cardEl.style.opacity = 0;

        // stopwatch while Pip says "six PRs in seventy-eight seconds"
        const w = smooth((t - 22.95) / 0.2) * (1 - smooth((t - 25.15) / 0.15));
        $("watch").style.opacity = w.toFixed(3);
        $("watch").style.transform = `scale(${(0.9 + 0.1 * easeOutBack((t - 22.95) / 0.4)).toFixed(3)})`;

        // combo list: each coin adds its PR (newest three shown so the runner stays visible)
        const combo = COINS.filter((c) => c.combo && t >= c.t);
        const comboEl = $("combo");
        const html = combo.slice(-3).map((c) => `<div class="row"><b>#${c.pr}</b><span>${c.title}</span></div>`).join("");
        if (comboEl.dataset.n !== String(combo.length)) { comboEl.innerHTML = html; comboEl.dataset.n = String(combo.length); }
        comboEl.style.opacity = combo.length && t < 28.9 ? 1 : combo.length ? (1 - smooth((t - 28.9) / 0.2)).toFixed(3) : 0;
      }

      // ---- the run: canvas, pseudo-3D three-lane train-roof runner -------------------------
      const cv = $("game");
      const ctx = cv.getContext("2d");
      const W = 1080, H = 966, HORIZON = 178, F = 400, CAM_H = 2.2, RUNNER_Z = 3.0;
      const SPEED = 12; // units/s; 12 × 32 s = 384 = 48 car periods, so the loop is seamless
      const LANE_W = 1.5, CAR_W = 1.22, PERIOD = 8, CAR_LEN = 7;
      const PHASE = { "-1": 0, "0": 2.7, "1": 5.3 };

      // lane schedule: be in the coin's lane 0.4 s before it, and in the obstacle lane before the crash
      const LANE_EVENTS = [...COINS.map((c) => ({ t: c.t, lane: c.lane })), { t: CRASH_T, lane: OBSTACLE_LANE }].sort((a, b) => a.t - b.t);
      function runnerX(t) {
        let x = 0;
        let prevLane = 0;
        for (const e of LANE_EVENTS) {
          const startMove = e.t - 0.42;
          x = prevLane * LANE_W + (e.lane - prevLane) * LANE_W * smooth((t - startMove) / 0.22);
          if (t < e.t) return x;
          prevLane = e.lane;
        }
        // after the last coin, drift home to the middle lane for the loop
        return prevLane * LANE_W * (1 - smooth((t - 28.6) / 0.6));
      }
      function hop(zWorld, lane) {
        const m = (((zWorld + PHASE[lane]) % PERIOD) + PERIOD) % PERIOD;
        if (m < CAR_LEN - 0.55) return 0;
        const k = (m - (CAR_LEN - 0.55)) / (PERIOD - CAR_LEN + 0.95);
        return k <= 1 ? Math.sin(Math.PI * k) * 0.42 : 0;
      }
      function proj(x, y, zRel, camX, shake) {
        const s = F / zRel;
        return [W / 2 + (x - camX) * s + shake, HORIZON + (CAM_H - y) * s, s];
      }
      // seeded skyline so every frame draws the same city
      const SKY = [];
      { let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        let x = -20; while (x < W + 20) { const w = 40 + rnd() * 90, h = 30 + rnd() * 110; SKY.push([x, w, h, rnd()]); x += w + 6; } }

      function drawGame(t) {
        const camZ = SPEED * t;
        const rx = runnerX(t);
        const camX = rx * 0.55;
        const sinceCrash = t - CRASH_T;
        const shake = sinceCrash >= 0 && sinceCrash < 0.35 ? Math.sin(sinceCrash * 90) * 22 * (1 - sinceCrash / 0.35) : 0;

        ctx.clearRect(0, 0, W, H);
        // sky and city
        const sky = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
        sky.addColorStop(0, "#15151B");
        sky.addColorStop(1, "#22222B");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);
        for (const [x, w, h, r] of SKY) {
          ctx.fillStyle = r > 0.5 ? "#15151B" : "#0A0A0D";
          ctx.fillRect(x - camX * 6, HORIZON - h, w, h + 2);
          if (r > 0.72) { ctx.fillStyle = "rgba(255,194,26,0.55)"; ctx.fillRect(x - camX * 6 + w * 0.3, HORIZON - h * 0.7, 6, 6); }
        }
        // ground
        ctx.fillStyle = "#0A0A0D";
        ctx.fillRect(0, HORIZON, W, H - HORIZON);

        // rails under each lane, far to near
        ctx.strokeStyle = "#26262F";
        ctx.lineWidth = 3;
        for (const lane of [-1, 0, 1]) {
          for (const dx of [-0.45, 0.45]) {
            const a = proj(lane * LANE_W + dx, -1.1, 60, camX, shake), b = proj(lane * LANE_W + dx, -1.1, 0.9, camX, shake);
            ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
          }
        }

        // train cars: draw far cars first
        const cars = [];
        for (const lane of [-1, 0, 1]) {
          const first = Math.floor((camZ - PHASE[lane]) / PERIOD) * PERIOD + PHASE[lane];
          for (let z0 = first; z0 < camZ + 60; z0 += PERIOD) cars.push([lane, z0 - camZ, z0 - camZ + CAR_LEN]);
        }
        cars.sort((a, b) => b[1] - a[1]);
        for (const [lane, za, zb] of cars) {
          const n = Math.max(za, 0.9), f = Math.min(zb, 60);
          if (f <= n) continue;
          const x0 = lane * LANE_W - CAR_W / 2, x1 = lane * LANE_W + CAR_W / 2;
          const p = (x, y, z) => proj(x, y, z, camX, shake);
          // side wall facing the camera
          const sideX = lane * LANE_W > camX ? x0 : x1;
          ctx.fillStyle = "#15151B";
          ctx.beginPath();
          [p(sideX, 0, n), p(sideX, 0, f), p(sideX, -1.1, f), p(sideX, -1.1, n)].forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
          ctx.fill();
          // windows on the side wall
          ctx.fillStyle = "rgba(255,194,26,0.18)";
          for (let wz = Math.ceil(za + 0.6); wz < zb - 0.6; wz += 1.3) {
            if (wz < n || wz + 0.7 > f) continue;
            const q = [p(sideX, -0.25, wz), p(sideX, -0.25, wz + 0.7), p(sideX, -0.65, wz + 0.7), p(sideX, -0.65, wz)];
            ctx.beginPath(); q.forEach((r, i) => (i ? ctx.lineTo(r[0], r[1]) : ctx.moveTo(r[0], r[1]))); ctx.fill();
          }
          // roof
          ctx.fillStyle = "#34343E";
          ctx.beginPath();
          [p(x0, 0, n), p(x1, 0, n), p(x1, 0, f), p(x0, 0, f)].forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
          ctx.fill();
          // roof ribs scroll with the world
          ctx.strokeStyle = "#80808C";
          ctx.lineWidth = 2;
          for (let rz = Math.ceil(za); rz < zb; rz += 1) {
            if (rz < n || rz > f) continue;
            const a = p(x0 + 0.08, 0, rz), b = p(x1 - 0.08, 0, rz);
            ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
          }
          // front face of the car when its front end is in view
          if (za > 0.9) {
            ctx.fillStyle = "#15151B";
            const a = p(x0, 0, za), b = p(x1, 0, za), c = p(x1, -1.1, za), d = p(x0, -1.1, za);
            ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.fill();
            ctx.fillStyle = "#FFC21A";
            const l1 = p(x0 + 0.22, -0.3, za), l2 = p(x1 - 0.22, -0.3, za);
            ctx.beginPath(); ctx.arc(l1[0], l1[1], Math.max(2, l1[2] * 0.07), 0, Math.PI * 2); ctx.arc(l2[0], l2[1], Math.max(2, l2[2] * 0.07), 0, Math.PI * 2); ctx.fill();
          }
        }

        // obstacle: the one bug PR, a red block on the middle lane, shatters on "Bonk"
        const obZ = SPEED * CRASH_T + RUNNER_Z + 0.35 - camZ;
        if (sinceCrash < 0 && obZ > 0.9 && obZ < 50) {
          const x0 = OBSTACLE_LANE * LANE_W - 0.55, x1 = OBSTACLE_LANE * LANE_W + 0.55;
          const a = proj(x0, 0.95, obZ, camX, shake), b = proj(x1, 0, obZ, camX, shake);
          const ta = proj(x0, 0.95, obZ + 0.5, camX, shake), tb = proj(x1, 0.95, obZ + 0.5, camX, shake);
          ctx.fillStyle = "#7A1A22";
          ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], a[1]); ctx.lineTo(tb[0], tb[1]); ctx.lineTo(ta[0], ta[1]); ctx.fill();
          ctx.fillStyle = "#FF2D3D";
          ctx.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
          const fs = Math.max(8, (b[0] - a[0]) * 0.16);
          ctx.fillStyle = "#F7F7FA";
          ctx.font = `900 ${fs}px TardyRounded`;
          ctx.textAlign = "center";
          ctx.fillText("2 VIDEOS", (a[0] + b[0]) / 2, a[1] + (b[1] - a[1]) * 0.42);
          ctx.fillText("AT ONCE", (a[0] + b[0]) / 2, a[1] + (b[1] - a[1]) * 0.42 + fs * 1.1);
        }
        if (sinceCrash >= 0 && sinceCrash < 1.2) {
          for (let i = 0; i < 9; i++) {
            const ang = -Math.PI / 2 + (i - 4) * 0.33;
            const sp = 2.2 + (i % 3) * 0.9;
            const sx = OBSTACLE_LANE * LANE_W + Math.cos(ang) * sp * sinceCrash;
            const sy = 0.5 - Math.sin(ang) * sp * sinceCrash - 4.5 * sinceCrash * sinceCrash;
            const sz = RUNNER_Z + 0.6 + 1.5 * sinceCrash;
            const q = proj(sx, sy, sz, camX, shake);
            const sz2 = q[2] * 0.22 * (1 - sinceCrash / 1.2);
            ctx.save(); ctx.translate(q[0], q[1]); ctx.rotate(sinceCrash * (6 + i));
            ctx.fillStyle = i % 2 ? "#FF2D3D" : "#7A1A22";
            ctx.fillRect(-sz2 / 2, -sz2 / 2, sz2, sz2);
            ctx.restore();
          }
        }

        // coins, far to near; collected coins fly up toward the HUD
        const coins = COINS.map((c) => ({ c, z: SPEED * c.t + RUNNER_Z - camZ })).sort((a, b) => b.z - a.z);
        for (const { c, z } of coins) {
          const since = t - c.t;
          if (since < 0) {
            if (z > 48) continue;
            const q = proj(c.lane * LANE_W, 0.62 + 0.08 * Math.sin(t * 8 + c.pr), z, camX, shake);
            const r = q[2] * 0.36;
            const spin = Math.abs(Math.cos(t * 5 + c.pr));
            ctx.save(); ctx.translate(q[0], q[1]); ctx.scale(0.35 + 0.65 * spin, 1);
            ctx.fillStyle = "#FFC21A"; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#14110A"; ctx.lineWidth = Math.max(1, r * 0.1); ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2); ctx.stroke();
            if (r > 14) { ctx.fillStyle = "#14110A"; ctx.font = `900 ${r * 0.62}px TardyRounded`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(`#${c.pr}`, 0, r * 0.04); }
            ctx.restore();
          } else if (since < 0.45) {
            const k = smooth(since / 0.45);
            const start = proj(c.lane * LANE_W, 0.62, RUNNER_Z, camX, shake);
            const x = start[0] + (150 - start[0]) * k, y = start[1] + (40 - start[1]) * k;
            const r = start[2] * 0.36 * (1 - 0.6 * k);
            ctx.globalAlpha = 1 - k * 0.6;
            ctx.fillStyle = "#FFC21A"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
            // sparkle ring at the pickup point
            ctx.strokeStyle = `rgba(255,194,26,${(1 - k).toFixed(3)})`; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(start[0], start[1], start[2] * (0.4 + 0.9 * k), 0, Math.PI * 2); ctx.stroke();
          }
        }

        // the runner: tardy's alarm-reel mascot, a yellow clock with a play-button face
        const rz = camZ + RUNNER_Z;
        const lane = Math.round(rx / LANE_W);
        const crashSquash = sinceCrash >= 0 && sinceCrash < 0.3 ? Math.sin((sinceCrash / 0.3) * Math.PI) : 0;
        const jump = hop(rz, String(clamp(lane, -1, 1))) + (crashSquash > 0 ? 0.25 * crashSquash : 0);
        const base = proj(rx, 0, RUNNER_Z, camX, shake);
        const body = proj(rx, 0.55 + jump, RUNNER_Z, camX, shake);
        const R = base[2] * 0.34;
        // shadow
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.beginPath(); ctx.ellipse(base[0], base[1], R * 0.9, R * 0.22, 0, 0, Math.PI * 2); ctx.fill();
        // legs, 0.4 s stride (80 strides in 32 s)
        const stride = Math.sin((2 * Math.PI * t) / 0.4);
        ctx.strokeStyle = "#F7F7FA"; ctx.lineWidth = R * 0.16; ctx.lineCap = "round";
        for (const s of [-1, 1]) {
          ctx.beginPath(); ctx.moveTo(body[0] + s * R * 0.35, body[1] + R * 0.8);
          ctx.lineTo(body[0] + s * R * 0.35 + stride * s * R * 0.35, body[1] + R * 1.35 - Math.max(0, stride * s) * R * 0.2);
          ctx.stroke();
        }
        ctx.save();
        ctx.translate(body[0], body[1]);
        ctx.rotate(-0.12 + 0.05 * stride + (rx - camX) * 0.02);
        ctx.scale(1 + 0.25 * crashSquash, 1 - 0.25 * crashSquash);
        // bells
        ctx.fillStyle = "#FFC21A";
        for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * R * 0.62, -R * 0.86, R * 0.34, Math.PI, 0); ctx.fill(); }
        // the alarm dot (the logo's red dot) rings on the beat
        const ring = beatPulse(t);
        ctx.fillStyle = "#FF2D3D";
        ctx.beginPath(); ctx.arc(R * 0.95 + ring * R * 0.08, -R * 0.95, R * (0.2 + 0.06 * ring), 0, Math.PI * 2); ctx.fill();
        // face
        ctx.fillStyle = "#FFC21A"; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#14110A"; ctx.beginPath(); ctx.arc(0, 0, R * 0.78, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#FFC21A";
        ctx.beginPath(); ctx.moveTo(-R * 0.26, -R * 0.38); ctx.lineTo(R * 0.44, 0); ctx.lineTo(-R * 0.26, R * 0.38); ctx.closePath(); ctx.fill();
        ctx.restore();
      }

      function render(t) {
        drawHosts(t);
        drawCaptions(t);
        drawCards(t);
        drawOverlay(t);
        drawGame(t);
      }

      document.fonts.ready.then(() => {
        const state = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);
        render(0);
        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
